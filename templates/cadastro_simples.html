{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<div class="cartao">
  <h2>Adicionar {{ singular }}</h2>
  <form method="post" action="{{ url_for('cadastro_simples_salvar', slug=slug) }}"
        style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
    <div class="campo" style="flex:1;min-width:220px">
      <label>Nome</label>
      <input name="nome" required autofocus placeholder="Ex: {{ 'Automóvel' if slug == 'tipo-seguro' else 'Boleto' }}">
    </div>
    <button class="btn btn--primario" type="submit">{{ icone('mais') }} Adicionar</button>
  </form>
</div>

<div class="cartao" style="padding:0">
  {% if itens %}
  <div class="tabela-wrap">
    <table class="lista">
      <thead><tr><th>Nome</th><th style="width:1%"></th></tr></thead>
      <tbody>
        {% for it in itens %}
        <tr>
          <td>
            <form method="post" action="{{ url_for('cadastro_simples_salvar', slug=slug) }}"
                  style="display:flex;gap:6px;align-items:center">
              <input type="hidden" name="id" value="{{ it.id }}">
              <input name="nome" value="{{ it.nome }}" style="max-width:340px"
                     onchange="this.form.requestSubmit ? this.form.requestSubmit() : this.form.submit()">
            </form>
          </td>
          <td class="acoes">
            <form method="post" action="{{ url_for('cadastro_simples_excluir', slug=slug, item_id=it.id) }}"
                  onsubmit="return confirm('Excluir “{{ it.nome }}”?')">
              <button class="btn btn--perigo btn--mini" type="submit">{{ icone('lixo') }}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="vazio">Nada cadastrado ainda.</p>
  {% endif %}
</div>
{% endblock %}
